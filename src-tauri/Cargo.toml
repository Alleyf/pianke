[package]
name = "pianke_tauri"
version = "0.1.0"
description = "Pianke desktop shell"
authors = ["pianke"]
edition = "2021"

[lib]
name = "pianke_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
