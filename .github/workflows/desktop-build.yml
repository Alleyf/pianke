name: Desktop Build & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.1.1). Leave empty to skip release.'
        required: false
        default: ''
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        include:
          - os: windows-latest
            artifact_name: 片刻_x64-setup.exe
            artifact_path: src-tauri/target/release/bundle/nsis/片刻_*_x64-setup.exe
          - os: macos-latest
            artifact_name: 片刻.dmg
            artifact_path: src-tauri/target/release/bundle/dmg/片刻*_*.dmg
          - os: ubuntu-22.04
            artifact_name: 片刻_amd64.deb
            artifact_path: src-tauri/target/release/bundle/deb/片刻*_*.deb
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Linux WebKit deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Python deps (desktop only)
        run: python -m pip install -r requirements-desktop.txt

      - name: Install Node deps
        run: npm ci

      - name: Generate Tauri icons
        run: python scripts/generate_tauri_icons.py

      - name: Build desktop bundle
        run: npm run desktop:build

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pianke-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: 片刻 ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            ## 片刻桌面版 ${{ github.event.inputs.release_tag || github.ref_name }}

            ### 下载
            - **Windows**: 片刻_x64-setup.exe
            - **macOS**: 片刻.dmg
            - **Linux**: 片刻_amd64.deb

            桌面端仅支持极速模式（fast）。专家/土豪模式请通过 Web 版运行。
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
          draft: false